experiment:
  name: gp2f_prompt_p20_class_conditioned_pattern_prompt_router
  seed: 0
  runs: 1
  source_dataset: Cora
  target_dataset: Cora
  prompt_variant: p20_class_conditioned_pattern_prompt_router

data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30

pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true

model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5

loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0

prompt_graph:
  enabled: false
  support_only_prompt_graph: false
  support_query_split:
    enabled: true
    support_ratio: 0.55
    min_query_per_class: 2
    resample_each_epoch: true
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.0
  lambda_prompt_role_diversity: 0.0
  lambda_prompt_acceptance: 0.0
  lambda_prompt_acceptance_budget: 0.0
  lambda_prompt_acceptance_supervision: 0.0
  lambda_prompt_usage_consistency: 0.0
  lambda_prompt_view_entropy: 0.0
  lambda_view_prior: 0.0
  lambda_class_route: 0.0
  lambda_key_proto: 0.0
  lambda_prompt_benefit_supervision: 0.0
  lambda_prompt_correction: 0.0
  lambda_prompt_anti_harm: 0.0
  lambda_prompt_message_help: 0.0
  lambda_prompt_message_help_query: 0.0
  lambda_prompt_class_anti_harm: 0.0
  lambda_utility_receive_gate: 0.0
  lambda_utility_receive_gate_query: 0.0
  lambda_receive_gate_budget: 0.0
  lambda_query_proto_alignment: 0.0
  lambda_edge_utility_supervision: 0.0
  lambda_correction_alignment: 0.0
  lambda_correction_anti_harm: 0.0

prompt_aware:
  enabled: false

prompt_adapter:
  enabled: true
  module_type: class_conditioned_pattern_router
  context_base: z_detached
  num_patterns: 6
  low_rank_dim: 8
  hidden_dim: 128
  dropout: 0.1
  # Non-zero message at init breaks routing symmetry (q_i receives gradient early).
  zero_init_message: false
  message_init_scale: 0.1
  # Bias initial routing toward heterophily experts; receive gate remains the
  # conservative reject mechanism.
  easy_init: 0.30
  pattern_reject_init_prob: 0.05
  use_frozen_disagreement: true
  use_support_context: false
  # Conservative gate to avoid opening the prompt too early.
  gate_init: 0.05
  max_update_norm: 0.04
  gate_budget: 0.12
  message_scale: 1.0
  use_candidate_pool: true
  candidate_pool_strategy: utility_structural
  candidate_pool_ratio: 0.30
  candidate_pool_include_train: true
  candidate_pool_structural_weight: 0.35
  candidate_pool_uncertainty_weight: 0.35
  candidate_pool_disagreement_weight: 0.30

training:
  epochs: 200
  lr: 0.001
  prompt_lr: 0.003
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 5
  eval_every: 5
  output_dir: outputs/gp2f_prompt_p20_class_conditioned_pattern_prompt_router
  early_stop_patience: 40
  early_stop_min_epochs: 20
  early_stop_metric: val_acc
  keep_best_checkpoint: true
  freeze_base_model: false
  train_prompt_adapter: true
  train_prompt_graph_module: false
  train_prompt_aware_module: false
  prompt_adapter_update_mask: candidate_pool
  prompt_adapter_loss_mask: query
  lambda_prompt_adapter_update_norm: 0.02
  lambda_prompt_adapter_gate_budget: 0.25
  lambda_prompt_adapter_message_help: 0.10
  prompt_adapter_message_help_margin: 0.005
  prompt_adapter_message_help_anti_harm_weight: 0.5
  prompt_adapter_message_help_anti_harm_margin: 0.0
  prompt_adapter_message_help_class_balanced: true
  lambda_prompt_adapter_utility_gate: 0.10
  prompt_adapter_utility_gate_temperature: 0.02
  prompt_adapter_utility_gate_margin: 0.00001
  prompt_adapter_utility_gate_class_balanced: true
  prompt_adapter_utility_gate_source: effective_gate
  prompt_adapter_episode_count_per_epoch: 3
  lambda_prompt_adapter_gate_consistency: 0.02
  lambda_prompt_adapter_delta_consistency: 0.01
  # Anti-collapse entropy-floor hinge (does NOT reward uniform usage).
  lambda_prompt_router_pattern_balance: 0.02
  prompt_router_pattern_balance_entropy_floor: 0.5
  # Direct PatternRouter supervision via per-expert utility (train/query labels only).
  # This is what makes the routing actually specialise.
  lambda_prompt_router_pattern_supervision: 0.1
  # Differentiable per-pattern utility trains the experts/prompt bank themselves.
  lambda_prompt_router_pattern_utility: 0.05
  # Temperature applies to per-node standardised utilities (z-scores).
  prompt_router_pattern_supervision_temperature: 0.5
  prompt_router_pattern_utility_temperature: 0.5
  prompt_router_pattern_utility_margin: 0.001
  prompt_router_pattern_utility_anti_harm_weight: 0.5
  prompt_router_pattern_utility_min_teacher_delta: 0.00001
  prompt_router_pattern_utility_helpful_fraction: 0.30
  prompt_router_pattern_utility_unhelpful_node_weight: 0.1
  # Class x pattern reliability smooths noisy node-wise utility labels.
  lambda_prompt_router_class_pattern_reliability: 0.03
  prompt_router_class_pattern_reliability_temperature: 0.5
  prompt_router_class_pattern_reliability_positive_margin: 0.00001
  prompt_router_class_pattern_reliability_harmful_margin: 0.0
  prompt_router_class_pattern_reliability_min_class_count: 2
  prompt_router_pattern_supervision_class_balanced: true
  prompt_router_pattern_utility_class_balanced: true
  diagnose_prompt_message_utility: false
  base_checkpoint_path:
  base_checkpoint_root:
  load_prompt_from_base_checkpoint: false
  # Oracle diagnostic only: when enabled, leak this fraction of test labels into
  # the supervised training pool. Keep disabled for clean generalization claims.
  enable_test_label_cheat: false
  test_label_cheat_fraction: 0.10
