experiment:
  name: gp2f_prompt_p23_selective_graphite_adapter_chameleon
  seed: 12346
  runs: 1
  trials_per_seed: 3
  source_dataset: Cora
  target_dataset: Chameleon
  prompt_variant: p23_selective_graphite_adapter
  split_seed: 12345
  trial_index: 1
  base_seed: 12345
  run_group_name: ctr0005
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  homophily_shots: 5
  auto_shot_by_dataset: true
  heterophily_shot_ratio: 0.1
  heterophily_datasets:
  - Actor
  - Squirrel
  - Chameleon
  - Minesweeper
  - amazon_ratings
  - AmazonRatings
  - Amazon-Ratings
  val_per_class: 30
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: true
  use_original_topology_fusion: false
  lambda_ctr: 0.0005
  lambda_fus: 0.0
prompt_graph:
  enabled: true
  module_type: class_aware_selective_graphite_prompt_graph
  static_graph: true
  feature_tokenizer:
    mode: topk_activation
    topk: 16
  feature_filter:
    min_df_global: 2
    max_df_global_ratio: 0.95
    min_label_count: 2
    min_purity: 0.25
    max_entropy: 0.98
    max_feature_nodes: 256
  feature_edge_weight: 1.0
  feature_edge_min_scale: 0.05
  feature_gate_floor: 0.2
  original_edge_weight: 1.0
  learn_feature_edge_weight: true
  use_feature_gate: true
  anti_hub_power: 0.5
  label_node_weight: 4.0
  unlabeled_node_weight: 0.2
  offclass_label_weight: 0.05
  detach_feature_prompt: true
  edge_scale_warmup_epochs: 0
  edge_scale_warmup_start: 1.0
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.0
  lambda_p23_feature_harm: 0.05
  lambda_p23_feature_gate_supervision: 0.0
  p23_feature_harm_margin: 0.02
  p23_feature_harm_temperature: 0.15
  p23_feature_harm_quantile: 0.8
  p23_feature_help_quantile: 0.6
  p23_feature_min_signal: 0.001
  p23_feature_help_weight: 0.5
  p23_feature_harm_warmup_epochs: 5
  p23_feature_harm_detach_delta: true
  p23_feature_harm_class_balanced: true
  lambda_prompt_usage_consistency: 0.0
  lambda_prompt_view_entropy: 0.0
  lambda_class_route: 0.0
  lambda_key_proto: 0.0
  use_node_feature_edge_gate: true
  node_feature_edge_gate_strength: 0.1
  static_pool:
    enabled: false
    mode: hard
    strategy: feature_label_ambiguity
    ratio: 0.15
    core_ratio: 0.15
    expand_ratio: 0.35
    core_scale: 1.2
    expand_scale: 1.1
    non_pool_scale: 1.0
    apply_to: prompt_to_node
    feature_topk: 16
prompt_aware:
  enabled: false
prompt_adapter:
  enabled: false
training:
  epochs: 160
  lr: 0.0005
  prompt_lr: 0.0005
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0
  grad_clip: 1.0
  log_every: 5
  eval_every: 5
  output_dir: outputs/gp2f_prompt_p23_selective_graphite_adapter_chameleon_fixed
  early_stop_patience: 35
  early_stop_min_epochs: 35
  early_stop_metric: val_macro_f1
  keep_best_checkpoint: true
  class_balanced_ce: true
  class_weight_mode: inverse_sqrt
  freeze_base_model: false
  freeze_input_aligner_for_p23: false
  train_prompt_graph_module: true
  train_prompt_adapter: false
  train_prompt_aware_module: false
  base_checkpoint_path: null
  base_checkpoint_root: null
  load_prompt_from_base_checkpoint: false
  enable_test_label_cheat: false
  test_label_cheat_fraction: 0.1
output_dir: /Users/jackson/IdeaRebuild/outputs/p23_chameleon_seed12345_gp2f_loss_search/ctr0005
