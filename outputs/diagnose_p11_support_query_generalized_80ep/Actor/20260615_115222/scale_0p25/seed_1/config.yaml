experiment:
  name: gp2f_prompt_p11_support_query_generalized
  seed: 1
  runs: 1
  source_dataset: Cora
  target_dataset: Actor
  prompt_variant: p5_lite_receiver
  seeds:
  - 0
  - 1
  - 2
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30
  shot_ratio: 0.05
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
prompt_graph:
  enabled: true
  variant: p5_lite_receiver
  num_prompt_nodes: 20
  rho: 0.2
  topk_prompt_per_node: 3
  use_capacity_routing: false
  capacity_factor: 1.25
  structural_base: z_detached
  pool_strategy: structural
  random_seed: 0
  tau: 0.5
  normalize_query_key: true
  query_dim: 128
  query_hidden_dim: 128
  query_dropout: 0.2
  prompt_init_std: 0.02
  use_rejection_gate: false
  use_hard_acceptance: false
  use_multiview_routing: true
  use_class_aware_routing: true
  residual_prompt_count: 12
  init_class_keys_from_train_proto: true
  class_key_init_source: structural_query
  class_key_init_normalize: true
  init_pattern_keys_from_pool_medoids: false
  pattern_key_init_normalize: true
  view_gate_hidden_dim: 128
  role_hidden_dim: 64
  edge_scale_init: 0.05
  edge_scale_max: 0.75
  edge_scale_warmup_epochs: 10
  edge_scale_warmup_start: 0.0
  support_only_prompt_graph: true
  support_query_split:
    enabled: true
    support_ratio: 0.55
    min_query_per_class: 2
    resample_each_epoch: true
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.0
  lambda_prompt_role_diversity: 0.001
  lambda_prompt_acceptance: 0.0
  lambda_prompt_acceptance_budget: 0.0
  lambda_prompt_acceptance_supervision: 0.0
  lambda_prompt_usage_consistency: 0.002
  usage_consistency_margin: 0.25
  usage_consistency_negative_weight: 0.01
  lambda_prompt_view_entropy: 0.0
  lambda_class_route: 0.01
  lambda_key_proto: 0.0005
  use_benefit_gate: false
  lambda_prompt_benefit_supervision: 0.0
  use_hard_receive_gate: false
  use_utility_receive_gate: true
  utility_receive_gate_hidden_dim: 128
  utility_receive_gate_min: 0.05
  utility_receive_gate_init: 0.75
  lambda_utility_receive_gate: 0.0
  lambda_utility_receive_gate_query: 0.02
  utility_receive_gate_warmup_epochs: 15
  utility_receive_gate_query_warmup_epochs: 15
  utility_receive_gate_quantile: 0.2
  utility_receive_gate_eps: 0.0001
  utility_receive_gate_class_balanced: true
  lambda_prompt_correction: 0.0
  lambda_prompt_anti_harm: 0.0
  lambda_prompt_message_help: 0.0
  lambda_prompt_message_help_query: 0.08
  prompt_message_help_margin: 0.005
  prompt_message_help_warmup_epochs: 5
  prompt_message_help_query_warmup_epochs: 5
  prompt_message_help_class_balanced: true
  lambda_prompt_class_anti_harm: 0.0
  prompt_class_anti_harm_floor: 0.0
  lambda_query_proto_alignment: 0.05
  query_proto_alignment_warmup_epochs: 5
  query_proto_margin: 0.005
  query_proto_class_balanced: true
prompt_aware:
  enabled: true
  receiver_version: v4_multi_expert_residual
  prompt_fusion: classifier_directional_residual
  dropout: 0.2
  gate_init: 0.05
  receiver_gate_init: 0.1
  prompt_to_node_gate_init: 0.15
  prototype_direction_init: 0.05
  prototype_direction_normalize: true
  zero_init_prompt_messages: false
  prompt_message_norm: weighted_mean
  message_scale: 0.25
  message_scale_grid:
  - 0.25
  pool_only_prompt_update: true
  use_node_to_prompt: false
  use_prompt_to_node: true
  use_bounded_prompt_update: true
  max_prompt_update_norm: 0.08
  prompt_update_bound_mode: norm_clip
training:
  epochs: 80
  lr: 0.001
  prompt_lr: 0.003
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 20
  eval_every: 5
  output_dir: outputs/diagnose_p11_support_query_generalized_80ep
  early_stop_patience: 40
  early_stop_min_epochs: 20
  early_stop_metric: val_acc
  message_scale_selection_metric: val_acc
  keep_best_checkpoint: true
  freeze_base_model: false
  train_prompt_graph_module: true
  train_prompt_aware_module: true
  diagnose_prompt_message_utility: true
  base_checkpoint_path: null
  base_checkpoint_root: null
  load_prompt_from_base_checkpoint: false
