experiment:
  name: gp2f_prompt_p0
  seed: 0
  runs: 1
  source_dataset: Cora
  target_dataset: Cora
  prompt_variant: full_p0
  seeds:
  - 0
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
prompt:
  enabled: true
  variant: unified_multiview_residual_p0
  gradient:
    h_pre_for_prompt: detach
    z_for_prompt: detach
    allow_prompt_to_aligner_grad: false
  semantic:
    enabled: true
    use_feature_proto: true
    use_hidden_proto: true
    beta_z: 0.5
    beta_h: 1.0
    tau_sem: 0.5
    use_leave_one_out_train_proto: true
    one_shot_train_semantic: mask
    use_margin_mask: false
    margin_threshold: 0.05
  structural:
    enabled: true
    base: z_detached
    base_ablation_options:
    - z_detached
    - h_pre_detached
    summary: enhanced_two_step_diffusion
    include_degree_features: true
    include_neighbor_variance: true
    include_similarity_features: true
    hidden_dim: 128
    dropout: 0.2
    bottleneck: true
    zero_init_output: true
  gate:
    hidden_dim: 64
    dropout: 0.2
    null_bias_init: 0.5
    use_null: true
  gamma_init: 0.01
  gamma_max: 0.1
  learnable_gamma: true
  zero_init_prompt_output: true
  route_budget_grid:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  - 0.35
  - 0.45
  route_budget: 0.1
  route_budget_selection: fixed
  selection_metric: val_acc
  lambda_budget: 0.5
  budget_warmup_epochs: 50
  budget_warmup_delay_epochs: 0
  message_norm_target: 0.05
  lambda_message_norm: 1.0
  message_norm_warmup_epochs: 20
  message_norm_warmup_delay_epochs: 0
controls:
  parameter_matched_residual:
    enabled: true
    use_labels: false
    use_graph_diffusion: false
    match_prompt_parameter_count: approximate
training:
  epochs: 3
  lr: 0.001
  prompt_lr: 0.003
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 20
  eval_every: 1
  output_dir: outputs/prompt_enhanced_smoke
  early_stop_patience: 40
  early_stop_min_epochs: 20
  early_stop_metric: val_acc
  keep_best_checkpoint: true
  freeze_base_model: false
  train_prompt_module: true
  base_checkpoint_path: null
  base_checkpoint_root: null
  load_prompt_from_base_checkpoint: false
