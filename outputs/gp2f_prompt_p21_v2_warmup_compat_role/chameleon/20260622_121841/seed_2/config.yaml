experiment:
  name: gp2f_prompt_p21_v2_compat_role
  seed: 2
  runs: 1
  source_dataset: Cora
  target_dataset: chameleon
  prompt_variant: p21_v2_hetero_filter
  seeds:
  - 0
  - 1
  - 2
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30
  shot_ratio: 0.1
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
prompt_graph:
  enabled: false
  support_query_split:
    enabled: true
    support_ratio: 0.55
    min_query_per_class: 2
    resample_each_epoch: true
  support_only_prompt_graph: false
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.0
  lambda_prompt_role_diversity: 0.0
  lambda_prompt_acceptance: 0.0
  lambda_prompt_acceptance_budget: 0.0
  lambda_prompt_acceptance_supervision: 0.0
  lambda_prompt_usage_consistency: 0.0
  lambda_prompt_view_entropy: 0.0
  lambda_view_prior: 0.0
  lambda_class_route: 0.0
  lambda_key_proto: 0.0
  lambda_prompt_benefit_supervision: 0.0
  lambda_prompt_correction: 0.0
  lambda_prompt_anti_harm: 0.0
  lambda_prompt_message_help: 0.0
  lambda_prompt_message_help_query: 0.0
  lambda_prompt_class_anti_harm: 0.0
  lambda_utility_receive_gate: 0.0
  lambda_utility_receive_gate_query: 0.0
  lambda_receive_gate_budget: 0.0
  lambda_query_proto_alignment: 0.0
  lambda_edge_utility_supervision: 0.0
  lambda_correction_alignment: 0.0
  lambda_correction_anti_harm: 0.0
prompt_aware:
  enabled: false
prompt_adapter:
  enabled: true
  module_type: p21_v2_hetero_filter
  hidden_dim: 128
  dropout: 0.1
  context_detach: true
  channel_set: reject_low_two_high_compat_role
  channel_prior:
  - 0.5
  - 0.1
  - 0.12
  - 0.1
  - 0.1
  - 0.08
  use_reject_channel: true
  reject_channel_index: 0
  use_compat_channel: true
  compat_support_source: full_train
  compat_source: no_prompt_logits
  compat_matrix: support_estimated
  compat_smoothing: 0.5
  compat_detach_logits: true
  compat_detach_prototypes: true
  use_role_channel: true
  role_hidden_dim: 64
  use_node_wise_gate: true
  residual_scale: 0.3
  beta_init: 0.1
  beta_max: 0.3
  gate_max: 0.3
  max_update_norm: 0.08
  use_candidate_pool: false
  candidate_pool_ratio: 1.0
  context_base: z_detached
  use_ego: true
  use_low_frequency: true
  use_two_step: true
  use_high_frequency: true
  use_role_features: true
  zero_init_delta: true
  gate_init: 0.05
  gate_budget: 0.35
  message_scale: 1.0
  num_patterns: 6
  low_rank_dim: 8
  zero_init_message: false
  message_init_scale: 0.1
  easy_init: 0.3
  pattern_reject_init_prob: 0.05
  use_frozen_disagreement: true
  candidate_pool_strategy: utility_structural
  candidate_pool_include_train: true
  candidate_pool_structural_weight: 0.35
  candidate_pool_uncertainty_weight: 0.35
  candidate_pool_disagreement_weight: 0.3
  use_support_context: false
  p21_channel_utility_temperature: 0.1
  p21_channel_utility_margin: 0.001
  p21_channel_utility_min_teacher_delta: 0.001
  p21_channel_utility_target_mode: hard_reject_or_best
  p21_channel_utility_gate_source: max
  p21_channel_utility_gate_source_warmup: max
  p21_channel_utility_actual_gate_start_epoch: 80
  p21_gate_utility_temperature: 0.02
  p21_gate_utility_margin: 0.001
  p21_gate_target_mode: soft
  p21_oracle_gate_source: max
  p21_oracle_scale_grid: &id001
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  - 4.0
training:
  epochs: 200
  lr: 0.001
  prompt_lr: 0.003
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 5
  eval_every: 5
  output_dir: outputs/gp2f_prompt_p21_v2_warmup_compat_role
  early_stop_patience: 40
  early_stop_min_epochs: 20
  early_stop_metric: val_acc
  keep_best_checkpoint: true
  freeze_base_model: true
  train_prompt_adapter: true
  train_prompt_graph_module: false
  train_prompt_aware_module: false
  prompt_adapter_update_mask: all
  prompt_adapter_loss_mask: query
  lambda_prompt_adapter_update_norm: 0.02
  lambda_prompt_adapter_gate_budget: 0.0
  lambda_prompt_adapter_message_help: 0.02
  prompt_adapter_message_help_margin: 0.005
  prompt_adapter_message_help_anti_harm_weight: 0.5
  prompt_adapter_message_help_anti_harm_margin: 0.0
  prompt_adapter_message_help_class_balanced: true
  lambda_prompt_adapter_utility_gate: 0.0
  prompt_adapter_episode_count_per_epoch: 1
  lambda_prompt_adapter_gate_consistency: 0.0
  lambda_prompt_adapter_delta_consistency: 0.0
  lambda_prompt_router_pattern_balance: 0.0
  lambda_prompt_router_pattern_supervision: 0.0
  lambda_prompt_router_pattern_utility: 0.0
  lambda_prompt_router_class_pattern_reliability: 0.0
  expert_warmup_epochs: 30
  lambda_p21_channel_expert_utility: 0.2
  lambda_p21_channel_expert_utility_after_warmup: 0.05
  p21_channel_expert_probe_scale: 1.0
  p21_channel_expert_temperature: 0.1
  p21_channel_expert_margin: 0.001
  p21_channel_expert_anti_harm_weight: 0.5
  lambda_p21_channel_utility: 0.3
  p21_channel_utility_temperature: 0.1
  p21_channel_utility_margin: 0.001
  p21_channel_utility_min_teacher_delta: 0.001
  p21_channel_utility_target_mode: hard_reject_or_best
  p21_channel_utility_gate_source: max
  p21_channel_utility_gate_source_warmup: max
  p21_channel_utility_actual_gate_start_epoch: 80
  p21_channel_utility_class_balanced: true
  p21_oracle_gate_source: max
  p21_oracle_scale_grid: *id001
  lambda_p21_gate_utility: 0.1
  p21_gate_utility_temperature: 0.02
  p21_gate_utility_margin: 0.001
  p21_gate_target_mode: soft
  lambda_prompt_router_deployment_utility: 0.05
  prompt_router_deployment_utility_margin: 0.0005
  prompt_router_deployment_utility_anti_harm_weight: 0.5
  prompt_router_deployment_utility_anti_harm_margin: 0.0
  prompt_router_deployment_utility_gain_reward_weight: 0.1
  prompt_router_deployment_utility_gain_reward_cap: 0.02
  prompt_router_deployment_utility_class_balanced: true
  diagnose_prompt_message_utility: false
  base_checkpoint_path: null
  base_checkpoint_root: outputs/noprompt_10pct_shot_control/chameleon/20260618_113809
  load_prompt_from_base_checkpoint: false
  enable_test_label_cheat: false
  test_label_cheat_fraction: 0.1
  prompt_adapter_utility_gate_temperature: 0.02
  prompt_adapter_utility_gate_margin: 1.0e-05
  prompt_adapter_utility_gate_class_balanced: true
  prompt_adapter_utility_gate_source: effective_gate
  prompt_router_pattern_balance_entropy_floor: 0.5
  prompt_router_pattern_utility_margin: 0.001
  prompt_router_pattern_utility_anti_harm_weight: 0.5
  prompt_router_pattern_utility_min_teacher_delta: 1.0e-05
  prompt_router_pattern_utility_helpful_fraction: 0.3
  prompt_router_pattern_utility_unhelpful_node_weight: 0.1
  prompt_router_class_pattern_reliability_temperature: 0.5
  prompt_router_class_pattern_reliability_positive_margin: 1.0e-05
  prompt_router_class_pattern_reliability_harmful_margin: 0.0
  prompt_router_class_pattern_reliability_min_class_count: 2
  prompt_router_pattern_supervision_temperature: 0.5
  prompt_router_pattern_utility_temperature: 0.5
  prompt_router_pattern_supervision_class_balanced: true
  prompt_router_pattern_utility_class_balanced: true
