experiment:
  name: gp2f_prompt_p5_multi_expert
  seed: 0
  runs: 1
  source_dataset: Cora
  target_dataset: Actor
  prompt_variant: p5_multi_expert
  seeds:
  - 0
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30
  shot_ratio: 0.05
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  input_aligner: identity_if_same_dim
  adapter_style: stable_zero_init
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  adapter_alpha_init: 0.1
  fusion_alpha_style: sigmoid
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
prompt_graph:
  enabled: true
  variant: p5_multi_expert
  num_prompt_nodes: 16
  rho: 0.2
  topk_prompt_per_node: 2
  use_capacity_routing: false
  capacity_factor: 1.25
  structural_base: z_detached
  pool_strategy: structural
  random_seed: 0
  tau: 0.5
  normalize_query_key: true
  query_dim: 128
  query_hidden_dim: 128
  query_dropout: 0.2
  prompt_init_std: 0.02
  use_rejection_gate: true
  rejection_gate_hidden_dim: 128
  rejection_gate_bias_init: -1.0
  rejection_gate_use_role_context: true
  rejection_gate_use_routing_features: true
  use_hard_acceptance: true
  hard_acceptance_ratio: 0.1
  hard_acceptance_straight_through: true
  use_multiview_routing: true
  use_class_aware_routing: true
  residual_prompt_count: 8
  init_class_keys_from_train_proto: true
  class_key_init_source: structural_query
  class_key_init_normalize: true
  init_pattern_keys_from_pool_medoids: true
  pattern_key_init_normalize: true
  view_gate_hidden_dim: 128
  role_hidden_dim: 64
  edge_scale_init: 0.05
  edge_scale_max: 0.75
  edge_scale_warmup_epochs: 20
  edge_scale_warmup_start: 0.0
  lambda_edge_l1: 0.0
  lambda_prompt_balance: 0.005
  lambda_prompt_role_diversity: 0.01
  lambda_prompt_acceptance: 0.0
  lambda_prompt_acceptance_budget: 0.0
  lambda_prompt_acceptance_supervision: 0.0
  lambda_prompt_usage_consistency: 0.02
  usage_consistency_margin: 0.25
  usage_consistency_negative_weight: 0.05
  lambda_prompt_view_entropy: 0.0
  lambda_class_route: 0.05
  lambda_key_proto: 0.001
  use_benefit_gate: true
  benefit_gate_bias_init: -1.0
  lambda_prompt_benefit_supervision: 0.05
  benefit_supervision_warmup_epochs: 10
  benefit_delta_margin: 0.0
  benefit_supervision_label_strategy: hybrid_quantile_margin
  benefit_supervision_quantile: 0.2
  benefit_delta_eps: 0.0001
  benefit_supervision_quantile_warmup_epochs: 10
  benefit_supervision_balance_targets: true
  use_hard_receive_gate: true
  hard_receive_ratio: 0.2
  hard_receive_straight_through: true
  lambda_prompt_correction: 0.0
  lambda_prompt_anti_harm: 0.0
  lambda_prompt_message_help: 0.1
  prompt_message_help_margin: 0.01
  prompt_message_help_warmup_epochs: 10
  prompt_message_help_class_balanced: true
  lambda_prompt_class_anti_harm: 0.1
  prompt_class_anti_harm_floor: 0.0
prompt_aware:
  enabled: true
  receiver_version: v4_multi_expert_residual
  prompt_fusion: multi_expert_residual_correction
  dropout: 0.2
  gate_init: 0.05
  receiver_gate_init: 0.01
  zero_init_prompt_messages: true
  prompt_message_norm: layernorm
  message_scale: 0.25
  message_scale_grid:
  - 0.25
  pool_only_prompt_update: true
  use_node_to_prompt: true
  use_prompt_to_node: true
  use_bounded_prompt_update: true
  max_prompt_update_norm: 0.05
  prompt_update_bound_mode: norm_clip
  message_norm: weighted_mean
training:
  epochs: 5
  lr: 0.001
  prompt_lr: 0.003
  prompt_lr_multiplier: 1.0
  weight_decay: 0.0005
  prompt_weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 20
  eval_every: 5
  output_dir: outputs/smoke_p5_multi_expert_v4
  early_stop_patience: 40
  early_stop_min_epochs: 20
  early_stop_metric: val_acc
  message_scale_selection_metric: val_acc
  keep_best_checkpoint: true
  freeze_base_model: false
  train_prompt_graph_module: true
  train_prompt_aware_module: true
  diagnose_prompt_message_utility: false
  base_checkpoint_path: null
  base_checkpoint_root: null
  load_prompt_from_base_checkpoint: false
