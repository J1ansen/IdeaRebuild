experiment:
  name: faithful_gp2f_baseline
  seed: 0
  source_dataset: Cora
  target_dataset: PubMed
data:
  root: /Users/jackson/MyIdea/data
  download_if_missing: false
  shots: 5
  val_per_class: 30
pretrained:
  checkpoint_path: pretrained_gnns/lr_0.0005_weightdecay_0.0005_hid_dim_128.pkl
  freeze_backbone: true
model:
  hidden_dim: 128
  adapter_bottleneck_dim: 16
  adapter_beta_init: 0.01
  alpha_init: 0.5
loss:
  use_cls: true
  use_original_contrastive: false
  use_original_topology_fusion: false
  lambda_ctr: 0.0
  lambda_fus: 0.0
training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0005
  grad_clip: 1.0
  log_every: 20
  output_dir: outputs/gp2f_baseline
